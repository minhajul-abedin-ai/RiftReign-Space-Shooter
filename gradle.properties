org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# RiftReign release feature flags.
# Safe defaults intentionally keep external monetization/social services OFF until
# their real Play Console / AdMob configuration exists. Core gameplay remains fully offline.
RIFT_ADS_ENABLED=false
RIFT_BILLING_ENABLED=false
RIFT_CONSUMABLE_PURCHASES_ENABLED=false
RIFT_PLAY_GAMES_CONFIGURED=false

# REQUIRED before you enable ads. AdMob identifiers are public identifiers, not passwords.
RIFT_ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
RIFT_REWARDED_AD_UNIT_ID=ca-app-pub-3940256099942544/5224354917
RIFT_INTERSTITIAL_AD_UNIT_ID=ca-app-pub-3940256099942544/1033173712

# REQUIRED for Play Console production: host PRIVACY_POLICY.html at an HTTPS public URL,
# then paste that URL here and into Play Console > App content > Privacy policy.
RIFT_PRIVACY_POLICY_URL=

# Google Play Games Services IDs. Fill these only if enabling RIFT_PLAY_GAMES_CONFIGURED.
RIFT_PGS_PROJECT_ID=0
RIFT_PGS_LEADERBOARD_HIGH_SCORE=disabled_leaderboard
RIFT_PGS_ACH_FIRST_RIFT=disabled_achievement_1
RIFT_PGS_ACH_WAVE_5=disabled_achievement_2
RIFT_PGS_ACH_WAVE_10=disabled_achievement_3
RIFT_PGS_ACH_HUNTER_100=disabled_achievement_4
RIFT_PGS_ACH_HUNTER_1000=disabled_achievement_5
RIFT_PGS_ACH_SCORE_10000=disabled_achievement_6
RIFT_PGS_ACH_OVERDRIVE_5=disabled_achievement_7
RIFT_PGS_ACH_COLLECTOR=disabled_achievement_8
