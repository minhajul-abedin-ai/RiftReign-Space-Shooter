name: Android launch build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  launch-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build offline launch variant
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleLaunchDebug
      - name: Upload debug APK (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: riftreign-launch-debug-apk
          path: app/build/outputs/apk/launch/debug/*.apk
          if-no-files-found: error
