name: Offline Android emulator smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build offline launch debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleLaunchDebug
      - name: Assert launch APK is not granted Internet or Billing permissions
        run: |
          APK=$(find app/build/outputs/apk/launch/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > permissions.txt
          cat permissions.txt
          if grep -E 'uses-permission.*(android.permission.INTERNET|com.android.vending.BILLING)' permissions.txt; then
            echo "Unexpected network or billing permission in offline launch APK" >&2
            exit 1
          fi
      - name: Syntax-check emulator script
        run: bash -n .github/scripts/emulator-smoke.sh
      - name: Boot emulator and launch game without live services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftreign-emulator-evidence
          path: |
            permissions.txt
            runtime-errors.txt
            activity_state.txt
            launch-result.txt
            gameplay-transition.txt
            tap-diagnostics.txt
            window_state.txt
            riftreign-boot.png
          if-no-files-found: warn
